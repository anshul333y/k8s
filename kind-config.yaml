kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
             node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 3003
        protocol: TCP
        listenAddress: "127.0.0.1"

  - role: worker
  - role: worker
